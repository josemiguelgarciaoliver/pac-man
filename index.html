<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Remake web de PAC-MAN: 100 niveles en 10 mundos." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pac-Man" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>PAC-MAN</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }

      #app { position: fixed; inset: 0; display: flex; flex-direction: column; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
      canvas { display: block; }

      /* Botones y d-pad */
      #controls { display: none; }
      #buttons { display: flex; gap: 10px; }
      .btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(120, 150, 255, .55); background: rgba(20, 30, 90, .55);
        color: #cdd8ff; display: grid; place-items: center; padding: 0; cursor: pointer; }
      .btn:active { background: rgba(60, 90, 255, .65); }
      .btn svg { width: 22px; height: 22px; fill: currentColor; }
      .btn[hidden] { display: none; }

      /* Habilidades de los hijos: Aina (pista) y Aleix (señuelo) */
      #helpers { display: none; gap: 12px; align-items: center; }
      .touch #helpers { display: flex; }
      .touch.dpad-on #helpers, .touch:not(.dpad-on) #helpers { flex-direction: column; }
      .helper { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--c); background: rgba(10, 12, 40, .6); color: var(--c);
        font: 800 11px/1.1 system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; padding: 0; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent); }
      .helper:active { background: color-mix(in srgb, var(--c) 35%, transparent); }
      .helper.used { opacity: .35; box-shadow: none; filter: grayscale(.8); }

      /* Escritorio: botones flotantes discretos */
      #app:not(.bar) #controls { display: block; position: absolute; top: 8px; right: 8px; opacity: .4; transition: opacity .2s; }
      #app:not(.bar) #controls:hover { opacity: 1; }
      #app:not(.touch) #dpad { display: none; }

      /* Táctil, vertical: barra inferior */
      .bar #controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 0 0 auto; padding: 8px 16px 10px; box-sizing: border-box; }
      .bar:not(.dpad-on) #controls { justify-content: center; }
      .touch.dpad-on #controls { height: clamp(160px, 31vh, 240px); }
      .touch.dpad-on #buttons { flex-direction: column; }
      #dpad { display: none; height: 100%; aspect-ratio: 1; position: relative; touch-action: none; }
      .dpad-on #dpad { display: block; }
      #dpad svg { width: 100%; height: 100%; display: block; }
      #dpad .arrow { fill: rgba(150, 175, 255, .35); stroke: rgba(150, 175, 255, .7); stroke-width: 2; transition: fill .05s; }
      #dpad .arrow.on { fill: rgba(150, 175, 255, .85); }
      #dpad circle { fill: rgba(20, 30, 90, .35); stroke: rgba(120, 150, 255, .4); stroke-width: 2; }

      /* Táctil, horizontal: controles sobre los márgenes laterales */
      @media (orientation: landscape) {
        .touch #controls, .touch.dpad-on #controls { position: absolute; inset: 0; height: auto; padding: 14px 22px; align-items: flex-end; pointer-events: none; }
        .touch #controls > * { pointer-events: auto; }
        .touch.dpad-on #dpad { height: min(42vh, 200px); }
        .touch:not(.dpad-on) #controls { align-items: flex-end; justify-content: flex-end; }
        .touch #buttons { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="game" width="224" height="288"></canvas></div>
      <div id="controls">
        <div id="dpad" aria-label="Cruceta">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="96" />
            <path class="arrow" data-dir="up" d="M100 22 L132 62 L68 62 Z" />
            <path class="arrow" data-dir="down" d="M100 178 L132 138 L68 138 Z" />
            <path class="arrow" data-dir="left" d="M22 100 L62 68 L62 132 Z" />
            <path class="arrow" data-dir="right" d="M178 100 L138 68 L138 132 Z" />
          </svg>
        </div>
        <div id="helpers">
          <button class="helper" id="btn-fire" style="--c:#ff9a45" aria-label="Disparar">FUEGO</button>
          <button class="helper" id="btn-aina" style="--c:#7fd7ff" aria-label="Aina: pista">AINA<br />PISTA</button>
          <button class="helper" id="btn-aleix" style="--c:#ffb347" aria-label="Aleix: señuelo">ALEIX<br />SEÑUELO</button>
        </div>
        <div id="buttons">
          <button class="btn" id="btn-pause" aria-label="Pausa" title="Pausa (P)"></button>
          <button class="btn" id="btn-mute" aria-label="Sonido" title="Sonido (M)"></button>
          <button class="btn" id="btn-mode" aria-label="Cambiar controles" title="Cambiar entre cruceta y gestos"></button>
          <button class="btn" id="btn-full" aria-label="Pantalla completa" title="Pantalla completa" hidden></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
